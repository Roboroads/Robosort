name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: "${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  upload-release:
    needs:
      - release-please
    if: needs.release-please.outputs.released
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Replace %%VERSION%%
        uses: jacobtomlinson/gha-find-replace@3.0.5
        with:
          find: "%%VERSION%%"
          replace: "${{ needs.release-please.outputs.version }}"
          regex: false

      - name: Get current datetime
        id: datetime
        run: echo "datetime=$(date +'%d-%m-%Y %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Replace %%UPDATED_AT%%
        uses: jacobtomlinson/gha-find-replace@3.0.5
        with:
          find: "%%UPDATED_AT%%"
          replace: "${{ steps.datetime.outputs.datetime }}"
          regex: false

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 8
          java-package: 'jdk+fx'
          cache: 'maven'

      - name: Build extension
        run: mvn -B package --file pom.xml

      - name: Make release folder
        run: mkdir -p release

      - name: Create extension.zip
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'extension.zip'
          directory: 'target/bin'

      - name: Collect G-ExtensionStore dependencies
        run: |
          cp target/bin/extension.zip release/extension.zip
          cp extension.json release/extension.json
          cp assets/icon.png release/icon.png

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'Robosort-${{ needs.release-please.outputs.tag_name }}.zip'
          directory: 'release'

      - name: Upload Release Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./release/Robosort-${{ needs.release-please.outputs.tag_name }}.zip

  # Opens a PR on G-ExtensionStore from the fork. EXTENSION_STORE_TOKEN is a classic PAT with the public_repo and workflow scopes.
  extension-store:
    needs:
      - release-please
      - upload-release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      UPSTREAM: sirjonasxx/G-ExtensionStore
      STORE_BRANCH: repo/1.5.3
      STORE_PATH: store/extensions/Robosort
    steps:
      - name: Download release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "Robosort-$TAG.zip" -D release
          unzip -o "release/Robosort-$TAG.zip" -d release/files
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > release/notes.md

      - name: Push update branch to fork
        id: push
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_STORE_TOKEN }}
        run: |
          login=$(gh api user -q .login)
          id=$(gh api user -q .id)
          branch="robosort-$VERSION"

          # The clone is shallow (the store is over 1 GB), so the fork needs the upstream tip before it can take the push
          gh repo sync "$login/G-ExtensionStore" --source "$UPSTREAM" --branch "$STORE_BRANCH" --force

          git clone --depth 1 --branch "$STORE_BRANCH" "https://github.com/$UPSTREAM.git" store
          cd store
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
          git switch -c "$branch"

          mkdir -p "$STORE_PATH"
          cp ../release/files/extension.json ../release/files/extension.zip ../release/files/icon.png "$STORE_PATH/"
          git add "$STORE_PATH"
          git commit -m "Update Robosort to $VERSION"

          git push --force "https://x-access-token:$GH_TOKEN@github.com/$login/G-ExtensionStore.git" "$branch"
          echo "head=$login:$branch" >> "$GITHUB_OUTPUT"

      - name: Open PR on G-ExtensionStore
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_STORE_TOKEN }}
          HEAD: ${{ steps.push.outputs.head }}
        run: |
          if [ -n "$(gh pr list -R "$UPSTREAM" --head "${HEAD#*:}" --state open -q '.[].number' --json number)" ]; then
            echo "PR for $HEAD already open, the force-push updated it"
            exit 0
          fi
          gh pr create -R "$UPSTREAM" --base "$STORE_BRANCH" --head "$HEAD" --title "Update Robosort to $VERSION" --body-file release/notes.md